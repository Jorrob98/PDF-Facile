name: DocFix 1.9.65 - Cross-document border and PDF QA
on:
  push:
    branches: [docfix-165-qa-matrix-20261123]
    paths:
      - 'docfix-build/app/docfix-wood-physical-edges.js'
      - 'docfix-build/qa-edge-corner-165.cjs'
      - 'docfix-build/qa-pdf-image-integrity-165.cjs'
      - '.github/workflows/docfix-165-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corners, background, shadows and PDF safety
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check app/docfix-wood-physical-edges.js
          node qa-edge-corner-165.cjs
          node qa-pdf-image-integrity-165.cjs
          node qa-wood-four-physical-164.cjs
          node qa-single-wood-163.cjs
          node qa-safe-pdf-163.cjs
          node qa-export-safety.cjs
          node qa-neural-borders-v2.cjs
          echo 'DOCFIX_165_CROSS_DOCUMENT_QA_PASS'
