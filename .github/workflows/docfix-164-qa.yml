name: DocFix 1.9.64 - Physical four-edge fitting QA
on:
  push:
    branches: [docfix-164-four-physical-edges-20261123]
    paths:
      - 'docfix-build/app/docfix-wood-physical-edges.js'
      - 'docfix-build/app/index.html'
      - 'docfix-build/main.js'
      - 'docfix-build/qa-wood-four-physical-164.cjs'
      - '.github/workflows/docfix-164-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test physical edges, four independent sides and safe export
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node --check app/docfix-wood-physical-edges.js
          node qa-wood-four-physical-164.cjs
          node qa-single-wood-163.cjs
          node qa-safe-pdf-163.cjs
          node qa-electron-inline-syntax.cjs
          node qa-export-safety.cjs
          node qa-neural-borders-v2.cjs
          node qa-single-final-gate.cjs
          node qa-pwa-ui-161.cjs
          node qa-simple-ui-and-four-card-order-159.cjs
          node qa-single-updater.cjs
          echo "DOCFIX_164_FOUR_EDGES_PASS"
