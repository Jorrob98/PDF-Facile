name: DocFix 1.9.63 - No phantom CIE page and bottom PDF download
on:
  push:
    branches: [docfix-163-one-card-one-page-20261123]
    paths:
      - 'docfix-build/app/docfix-wood-single.js'
      - 'docfix-build/app/index.html'
      - 'docfix-build/app/docfix-qa-review.js'
      - 'docfix-build/main.js'
      - 'docfix-build/qa-single-wood-163.cjs'
      - 'docfix-build/qa-safe-pdf-163.cjs'
      - '.github/workflows/docfix-163-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test front/back CIE, buttons and previously valid features
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node --check app/docfix-wood-single.js
          node --check app/docfix-qa-review.js
          node qa-single-wood-163.cjs
          node qa-safe-pdf-163.cjs
          node qa-electron-inline-syntax.cjs
          node qa-export-safety.cjs
          node qa-collaudo-pdf-162.cjs
          node qa-pwa-ui-161.cjs
          node qa-single-final-gate.cjs
          node qa-neural-borders-v2.cjs
          node qa-simple-ui-and-four-card-order-159.cjs
          node qa-single-updater.cjs
          echo 'DOCFIX_1_9_63_QA_PASS'
