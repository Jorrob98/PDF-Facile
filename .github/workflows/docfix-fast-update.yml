          grep -F "licenceSourceNeverChanged" verify/main.js
          grep -F "DocFixLicenceGuard" verify/app/card-licence-guard.js
          grep -F "function pinkEnvelope(" verify/app/card-licence-guard.js
          grep -F "method:colour.verified" verify/app/card-licence-guard.js
          grep -F "Bordi da verificare" verify/app/index.html
          grep -F "portrait coordinate transformation lost the recovered right edge" qa-stability-guard.cjs
          grep -F "regroupSixCards" verify/app/index.html
          grep -F "photoSide:c.sideGuess" verify/app/index.html
          grep -F "threeCardPolish" verify/main.js
          grep -F "sixCardGrouping" verify/main.js
          grep -F "planSixCardOrder" verify/app/index.html
          grep -F "cfDarkness" verify/app/index.html
          grep -F "sixCardActualOrder" verify/main.js
          grep -F "sixCardDarknessRecovery" verify/main.js
          grep -F "sixCardUncertainSafe" verify/main.js
          grep -F "straightenLicenceWithoutCutting" verify/app/index.html
          grep -F "straightenLicenceWithoutCutting(processed)" verify/app/index.html
          grep -F "sixPageUniqueExport" verify/main.js
          grep -F "DocFix-1.9.23-6-tessere.pdf" verify/app/group5-export.js
          grep -F "jpegInfo" verify/app/group5-export.js
          grep -F "while(queue.length&&host()?.isBusy?.())" verify/app/ocr-max.js
          grep -F "withResizedCanvas" verify/app/index.html
          grep -F "realJPEG" qa-stability-guard.cjs
          grep -F "q[2].y+7/h" verify/app/card-threeup-polish.js
          grep -F "DocFix 1.9.23" verify/app/index.html
          grep -F "materialVerified:allTypes" verify/app/card-threeup-polish.js
          grep -F "DocFixThreeUpPolish" verify/app/card-threeup-polish.js
          grep -F "outerQuad" verify/app/card-threeup.js
          grep -F "threeByTwoState" verify/app/index.html
          grep -F "threeUp:true" verify/app/index.html
          grep -F "threeCardsFromOne" verify/main.js
          grep -F "threeCardsOrientCorrect" verify/main.js
          grep -F "sixCardGate" verify/main.js
          grep -F "Bordi da verificare" verify/app/index.html
          grep -F "cropVerified:physicalVerified" verify/app/index.html
          grep -F "onePassPhysicalOriginal" verify/main.js
          grep -F "onePassBlankRejected" verify/main.js
          grep -F "onePassTwoCards" verify/main.js
          grep -F "physical-outer-boundaries-lines" verify/app/card-physical-edges.js
          grep -F "cfPhysicalCrop" verify/main.js
          grep -F "fineDeskew" verify/main.js
          grep -F "cfFineDeskew" verify/main.js
          grep -F "deskewResidualVerified" verify/main.js
          grep -F "residuo " verify/app/index.html
          grep -F "nessun miglioramento verificato" verify/app/index.html
          grep -F "diagnosticsCoverage" verify/main.js
          grep -F "projection-bands" verify/app/index.html
          grep -F "estimateFineDeskew" verify/app/index.html
          grep -F "raddrizzato " verify/app/index.html
          grep -F "cardKind==='cf'" verify/app/index.html
          grep -F "rotatedProbe" verify/app/index.html
          grep -F "tightenSeparatedCardCanvas" verify/app/index.html
          grep -F "cropVerified:physicalVerified" verify/app/index.html
          grep -F "twoByTwoCandidateMeta" verify/app/index.html
          grep -F "rebuildSourceAsTwoUp" verify/app/index.html
          grep -F "stackedCardCandidatesRecovery" verify/app/index.html
          grep -F "recoverIncompleteTwoByTwo" verify/app/index.html
          grep -F "Set incompleto" verify/app/index.html
          grep -F "safeRefineMultiQuad" verify/app/index.html
          grep -F "regroupLatestTwoUpSources" verify/app/index.html
          grep -F "Ritaglio prudente: controlla i bordi" verify/app/index.html
          grep -F "set completo 4/4" verify/app/index.html
          grep -F "Scambia fronte/retro" verify/app/index.html
          grep -F "pairedFourCards" verify/app/index.html
          grep -F "4 tessere separate" verify/app/index.html
          grep -F "stacked-gap-color" verify/app/index.html
          grep -F "Inverti ordine file" verify/app/index.html
          grep -F "openUpdateProgress" verify/app/stability.js
          grep -F "1.9.23" verify/package.json
          test -f verify/app/vendor/pdfjs/pdf.min.mjs
          test -f verify/app/vendor/tessdata/eng.traineddata.gz
          test -f verify/app/vendor/tessdata/ita.traineddata.gz

          size=$(stat -c%s DocFix-1.9.23-app.asar)
          if [ "$size" -lt 1000000 ]; then echo "app.asar troppo piccolo: $size"; exit 1; fi
          echo "APP_ASAR_SIZE=$size" >> "$GITHUB_ENV"
          echo "APP_ASAR_SHA=$(sha256sum DocFix-1.9.23-app.asar | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Run Electron functional self-test before publishing
        shell: bash
        working-directory: docfix-build
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          timeout 180s xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --self-test

      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis

      - name: Build Windows incremental updater
        shell: bash
        working-directory: docfix-build
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$version" | cut -d. -f1,2)
          updater="DocFix_Aggiornamento_${short}.exe"
          shafile="DocFix_Aggiornamento_${short}.sha256"
          cat > update.nsi <<'NSI'
          Unicode true
          Name "Aggiornamento DocFix 1.9.23"
          OutFile "__UPDATER_EXE__"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          SetCompressorDictSize 64
          InstallDir "$LOCALAPPDATA\Programs\docfix-desktop"
          ShowInstDetails nevershow
          AutoCloseWindow true
          Page instfiles

          Section "Aggiornamento"
            IfFileExists "$INSTDIR\DocFix.exe" found tryalternate

            tryalternate:
              StrCpy $INSTDIR "$LOCALAPPDATA\Programs\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found scanprograms

            scanprograms:
              StrCpy $1 "$LOCALAPPDATA\Programs"
              FindFirst $2 $3 "$1\*"
            scanloop:
              StrCmp $3 "" scanlocal
              StrCmp $3 "." scannext
              StrCmp $3 ".." scannext
              IfFileExists "$1\$3\DocFix.exe" 0 scannext
              StrCpy $INSTDIR "$1\$3"
              FindClose $2
              Goto found
            scannext:
              FindNext $2 $3
              Goto scanloop

            scanlocal:
              FindClose $2
              StrCpy $INSTDIR "$LOCALAPPDATA\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found notfound

            found:
              DetailPrint "Chiudo DocFix..."
              nsExec::ExecToStack 'taskkill /IM "DocFix.exe" /F'
              Pop $0
              Pop $1
              Sleep 1400

              Delete "$INSTDIR\resources\app.asar.bak"
              StrCpy $4 0

            backup_retry:
              ClearErrors
              Rename "$INSTDIR\resources\app.asar" "$INSTDIR\resources\app.asar.bak"
              IfErrors backup_wait backup_ok

            backup_wait:
              IntOp $4 $4 + 1
              IntCmp $4 12 backupfail backup_sleep backupfail

            backup_sleep:
              Sleep 500
              Goto backup_retry

            backup_ok:
              SetOutPath "$INSTDIR\resources"
              File /oname=app.asar.new "DocFix-1.9.23-app.asar"

              ClearErrors
              FileOpen $3 "$INSTDIR\resources\app.asar.new" r
              IfErrors rollback
              FileSeek $3 0 END $0
              FileClose $3
              IntCmp $0 __SIZE__ payloadok rollback rollback

            payloadok:
              StrCpy $4 0

            install_retry:
              ClearErrors
              Rename "$INSTDIR\resources\app.asar.new" "$INSTDIR\resources\app.asar"
              IfErrors install_wait install_ok

            install_wait:
              IntOp $4 $4 + 1
              IntCmp $4 12 rollback install_sleep rollback

            install_sleep:
              Sleep 500
              Goto install_retry

            install_ok:
              FileOpen $2 "$INSTDIR\resources\docfix-version.txt" w
              FileWrite $2 "1.9.23"
              FileClose $2
              FileOpen $2 "$INSTDIR\resources\docfix-update-status.txt" w
              FileWrite $2 "OK 1.9.23"
              FileClose $2
              Delete "$INSTDIR\resources\app.asar.bak"

              Sleep 700
              ExecShell "open" "$INSTDIR\DocFix.exe"
              IfSilent success_silent 0
              MessageBox MB_ICONINFORMATION|MB_OK "DocFix è stato aggiornato alla versione 1.9.23.$\r$\n$\r$\nIl programma è stato riaperto."
            success_silent:
              SetErrorLevel 0
              Goto done

            rollback:
              Delete "$INSTDIR\resources\app.asar.new"
              Delete "$INSTDIR\resources\app.asar"
              ClearErrors
              Rename "$INSTDIR\resources\app.asar.bak" "$INSTDIR\resources\app.asar"
              IfSilent rollback_silent 0
              ExecShell "open" "$INSTDIR\DocFix.exe"
              MessageBox MB_ICONSTOP|MB_OK "Aggiornamento non applicato. DocFix è stato ripristinato."
            rollback_silent:
              SetErrorLevel 2
              Goto done

            backupfail:
              IfSilent backup_silent 0
              ExecShell "open" "$INSTDIR\DocFix.exe"
              MessageBox MB_ICONSTOP|MB_OK "Non riesco ad aggiornare DocFix. La versione precedente non è stata modificata."
            backup_silent:
              SetErrorLevel 3
              Goto done

            notfound:
              IfSilent notfound_silent 0
              MessageBox MB_ICONSTOP|MB_OK "DocFix non risulta installato in questo PC."
            notfound_silent:
              SetErrorLevel 4

            done:
          SectionEnd
          NSI
          sed -i "s/__SIZE__/$APP_ASAR_SIZE/g; s/__UPDATER_EXE__/$updater/g" update.nsi
          makensis -V2 update.nsi

          test -f "$updater"
          size=$(stat -c%s "$updater")
          if [ "$size" -lt 5000000 ]; then echo "Updater troppo piccolo: $size"; exit 1; fi

          sha=$(sha256sum "$updater" | awk '{print $1}')
          echo "$sha  $updater" > "$shafile"
          echo "UPDATER_FILE=$updater" >> "$GITHUB_ENV"
          echo "UPDATER_SHA_FILE=$shafile" >> "$GITHUB_ENV"
          echo "UPDATER_SIZE=$size"
          echo "UPDATER_SHA=$sha"
          file "$updater" | grep -Ei 'PE32|MS Windows'

      - name: Publish verified DocFix 1.9.23 simplified update
        shell: bash
        working-directory: docfix-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          short=$(echo "$version" | cut -d. -f1,2)
          updater="DocFix_Aggiornamento_${short}.exe"
          shafile="DocFix_Aggiornamento_${short}.sha256"
          tag="v$version"
          title="DocFix Desktop $version"
          notes='DocFix Desktop 1.9.23: audit dei mancati ritagli. Una foto in formato A4 puo contenere una tessera separata: ora il riconoscimento della plastica azzurra CIE o rosa patente non viene piu respinto solo per la forma del foglio. Controlli dedicati contro ritaglio di volto, cornici interne e doppio ritaglio di una tessera gia pronta. Se un metodo propone un contorno non valido, DocFix tenta un altro rilevatore sicuro; se la prospettiva o i rilevatori generano un errore conserva l originale e segnala il controllo mancato. Migliorata la gestione di errori dei rilevatori per 2 e 3 tessere, evitando di eliminare la pratica. Test sintetici specifici per A4, CIE, patente, ritratto ed eccezioni. L OCR resta invariato.'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$updater" "$shafile" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" "$updater" "$shafile" --title "$title" --notes "$notes" --latest
          fi

          latest=$(gh api repos/Jorrob98/PDF-Facile/releases/latest --jq .tag_name)
          test "$latest" = "$tag"
          gh api repos/Jorrob98/PDF-Facile/releases/latest --jq '.assets[].name' | grep -Fx "$updater"
          gh api repos/Jorrob98/PDF-Facile/releases/latest --jq '.assets[].name' | grep -Fx "$shafile"

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFix-Aggiornamento-fast
          path: |
            docfix-build/${{ env.UPDATER_FILE }}
            docfix-build/${{ env.UPDATER_SHA_FILE }}
          if-no-files-found: error
          retention-days: 7
