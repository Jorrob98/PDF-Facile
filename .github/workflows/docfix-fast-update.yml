name: Build DocFix Fast Incremental Update
# SUPER RUN FINAL 1.9.23
# final source sync 1.9.23: protective physical-edge guard
# retry verified multi-card 1.9.23
# OCR MAX final rebuild 1.9.23

on:
  push:
    branches: [main]

concurrency:
  group: docfix-fast-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-fast-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DocFix source
        uses: actions/checkout@v4
        with:
          ref: docfix-desktop-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund

      - name: Bundle local PDF and OCR engines
        working-directory: docfix-build
        run: npm run prepare-vendor

      - name: Restore icon
        shell: bash
        working-directory: docfix-build
        run: |
          mkdir -p build
          base64 -d build/icon.b64 > build/icon.png

      - name: Validate DocFix 1.9.23 updater progress and workflow
        shell: bash
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node --check qa-stability-guard.cjs
          node qa-stability-guard.cjs
          node --check preload.js
          node --check ocr-cloud-main.js
          node --check app/ocr-max.js
          node --check app/stability.js
          node --check app/group1-safe-crop.js
          node --check app/card-physical-edges.js
          node --check app/card-onepass.js
          node --check app/card-texture-crop.js
          node --check app/card-threeup.js
          node --check app/card-threeup-polish.js
          node --check app/card-licence-guard.js
          grep -F 'if(sample!==original)' app/card-texture-crop.js
          grep -F "win.once('ready-to-show'" main.js
          grep -F "win.webContents.once('dom-ready'" main.js
          grep -F "startup-fallback'),300" main.js
          grep -F "STARTUP_BUNDLE_OK" main.js
          grep -F "ENGINE_BUNDLE_OK" main.js
          grep -F "listen(18654)" main.js
          grep -F "pendingSecondInstance" main.js
          grep -F "if(show)showWindow('load-complete')" main.js
          grep -F "1.9.23" package.json
          test "$(find app/vendor/tesseract-core -name 'tesseract-core*.wasm.js' | wc -l)" -ge 4
          test -f app/vendor/pdfjs/pdf.min.mjs
          test -f app/vendor/pdfjs/pdf.worker.min.mjs
          test -f app/vendor/tesseract/tesseract.min.js
          test -f app/vendor/tessdata/eng.traineddata.gz
          test -f app/vendor/tessdata/ita.traineddata.gz

          rm -rf pack verify
          mkdir -p pack/app pack/build
          cp main.js preload.js ocr-cloud-main.js package.json pack/
          cp -a app/. pack/app/
          cp build/icon.png pack/build/icon.png

          npx --no-install asar pack pack DocFix-1.9.23-app.asar
          npx --no-install asar extract DocFix-1.9.23-app.asar verify
          node --check verify/main.js
          grep -F "startup-fallback'),300" verify/main.js
          grep -F "STARTUP_BUNDLE_OK" verify/main.js
          grep -F "listen(18654)" verify/main.js
          grep -F "Ctrl+O" verify/app/index.html
          grep -F "document.addEventListener('paste'" verify/app/index.html
          grep -F "function qualityAudit" verify/app/index.html
          grep -F "Qualità da controllare" verify/app/index.html
          grep -F "alreadyDocumentShape" verify/app/index.html
          grep -F "trimCardBackground(processed,backLike)" verify/app/index.html
          grep -F 'class="advanced-options"' verify/app/index.html
          grep -F "version:'1.9.23'" verify/app/index.html
          grep -F "const VERSION='1.9.23'" verify/app/stability.js
          grep -F "DocFixOCRCloud" verify/preload.js
          grep -F "registerOcrHandlers" verify/main.js
          grep -F "OCR MAX" verify/app/ocr-max.js
          grep -F "createWorker(['ita','eng']" verify/app/ocr-max.js
          grep -F "eu-vision.googleapis.com" verify/ocr-cloud-main.js
          grep -F "prebuilt-read" verify/ocr-cloud-main.js
          grep -F "prebuilt-idDocument" verify/ocr-cloud-main.js
          grep -F "jsonRequestRetry" verify/ocr-cloud-main.js
          grep -F "google-rescue" verify/ocr-cloud-main.js
          grep -F "docfix:reset" verify/app/ocr-max.js
          grep -F "scheduleWorkerRelease" verify/app/ocr-max.js
          grep -F "Privacy sotto controllo" verify/app/index.html
          grep -F "labeledFields" verify/app/ocr-max.js
          grep -F "group1-superrun-20261105" verify/app/group1-safe-crop.js
          grep -F "no-cache, no-store, must-revalidate" verify/main.js
          grep -F "child.once('spawn'" verify/main.js
          grep -F "smartFilename" verify/main.js
          grep -F "docfix:update:progress" verify/main.js
          grep -F "UPDATE_DIRECT_LAUNCHED" verify/main.js
