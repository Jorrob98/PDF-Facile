          grep -F "update.hidden=true" verify/app/stability.js
          grep -F "Aggiornamento disponibile" verify/app/stability.js
          grep -F "updaterHiddenWhenNoUpdate" verify/main.js
          grep -F "multiCardSafe" verify/main.js
          grep -F "safeMultiCropPreview" verify/app/index.html
          grep -F "multiCropHealthy" verify/app/index.html
          grep -F "orderedIncoming" verify/app/index.html
          grep -F "inputOrder" verify/main.js
          grep -F "reverseFileOrder" verify/main.js
          grep -F "stackedCardCandidatesByGap" verify/app/index.html
          grep -F "stackedEdgeCards" verify/main.js
          grep -F "fourCardPairOrder" verify/main.js
          grep -F "multiRefineSafe" verify/main.js
          grep -F "stackedRecovery" verify/main.js
          grep -F "twoByTwoGate" verify/main.js
          grep -F "onePlusOneRecovery" verify/main.js
          grep -F "tightSeparatedCard" verify/main.js
          grep -F "physicalLineDeskew" verify/main.js
          grep -F "physicalNoFalseCrop" verify/main.js
          grep -F "card-physical-edges.js" verify/app/index.html
          grep -F "card-onepass.js" verify/app/index.html
          grep -F "card-texture-crop.js" verify/app/index.html
          grep -F "sourceVerified:verified" verify/app/index.html
          grep -F "textureTwoCards" verify/main.js
          grep -F "card-threeup.js" verify/app/index.html
          grep -F "card-threeup-polish.js" verify/app/index.html
          grep -F "card-licence-guard.js" verify/app/index.html
          grep -F "protectLicence" verify/app/index.html
          grep -F "licencePhysicalBorderRecovered" verify/main.js
