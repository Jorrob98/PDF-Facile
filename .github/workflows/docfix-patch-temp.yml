name: Build DocFix Incremental Update

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build-update:
    runs-on: windows-latest
    steps:
      - name: Checkout DocFix 1.3 source
        uses: actions/checkout@v4
        with:
          ref: docfix-desktop-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore application icon
        shell: pwsh
        working-directory: docfix-build
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $b64=(Get-Content build\icon.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes('build\icon.png',[Convert]::FromBase64String($b64))

      - name: Install dependencies and local engines
        working-directory: docfix-build
        run: |
          npm install --no-audit --no-fund
          npm run prepare-vendor

      - name: Build unpacked DocFix 1.3
        working-directory: docfix-build
        run: npx electron-builder --win dir --x64 --publish never

      - name: Validate update payload
        shell: pwsh
        working-directory: docfix-build
        run: |
          $asar=Get-Item 'dist\win-unpacked\resources\app.asar'
          if($asar.Length -lt 1000000){ throw "app.asar troppo piccolo: $($asar.Length)" }
          $hash=(Get-FileHash $asar.FullName -Algorithm SHA256).Hash
          "APP_ASAR_SHA=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ASAR_SIZE=$($asar.Length)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Payload app.asar: $($asar.Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Create incremental updater
        shell: pwsh
        working-directory: docfix-build
        run: |
          $hash=$env:APP_ASAR_SHA
          $script=@'
          Unicode true
          Name "Aggiornamento DocFix 1.3"
          OutFile "DocFix_Aggiornamento_1.3.exe"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          SetCompressorDictSize 64
          InstallDir "$LOCALAPPDATA\Programs\docfix-desktop"
          ShowInstDetails nevershow
          AutoCloseWindow false
          Page instfiles

          Section "Aggiornamento"
            IfFileExists "$INSTDIR\DocFix.exe" found tryalternate
            tryalternate:
              StrCpy $INSTDIR "$LOCALAPPDATA\Programs\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found notfound

            found:
              DetailPrint "Chiudo DocFix..."
              nsExec::ExecToStack 'taskkill /IM "DocFix.exe" /F'
              Pop $0
              Pop $1
              Sleep 1200

              DetailPrint "Preparo copia di sicurezza..."
              Delete "$INSTDIR\resources\app.asar.bak"
              Rename "$INSTDIR\resources\app.asar" "$INSTDIR\resources\app.asar.bak"
              IfErrors backupfail

              SetOutPath "$INSTDIR\resources"
              File /oname=app.asar.new "dist\win-unpacked\resources\app.asar"

              DetailPrint "Verifico il nuovo pacchetto..."
              ClearErrors
              FileOpen $3 "$INSTDIR\resources\app.asar.new" r
              IfErrors rollback
              FileSeek $3 0 END $0
              FileClose $3
              IntCmp $0 __SIZE__ payloadok rollback rollback

            payloadok:
              Delete "$INSTDIR\resources\app.asar"
              Rename "$INSTDIR\resources\app.asar.new" "$INSTDIR\resources\app.asar"
              IfErrors rollback
              Delete "$INSTDIR\resources\app.asar.bak"

              FileOpen $2 "$INSTDIR\resources\docfix-version.txt" w
              FileWrite $2 "1.3.0"
              FileClose $2

              DetailPrint "Aggiornamento completato."
              IfSilent success_nomsg 0
              Exec '"$INSTDIR\DocFix.exe"'
              MessageBox MB_ICONINFORMATION|MB_OK "DocFix è stato aggiornato alla versione 1.3.$\r$\n$\r$\nIl programma verrà riaperto automaticamente."
            success_nomsg:
              Goto done

            rollback:
              DetailPrint "Verifica non riuscita: ripristino la versione precedente..."
              Delete "$INSTDIR\resources\app.asar.new"
              Delete "$INSTDIR\resources\app.asar"
              Rename "$INSTDIR\resources\app.asar.bak" "$INSTDIR\resources\app.asar"
              IfSilent rollback_nomsg 0
              MessageBox MB_ICONSTOP|MB_OK "Aggiornamento non applicato.$\r$\nDocFix è stato ripristinato alla versione precedente."
            rollback_nomsg:
              SetErrorLevel 2
              Goto done

            backupfail:
              IfSilent backup_nomsg 0
              MessageBox MB_ICONSTOP|MB_OK "Non riesco a preparare l'aggiornamento. Chiudi DocFix e riprova."
            backup_nomsg:
              SetErrorLevel 3
              Goto done

            notfound:
              IfSilent notfound_nomsg 0
              MessageBox MB_ICONSTOP|MB_OK "DocFix non risulta installato in questo PC.$\r$\nInstalla prima DocFix Desktop 1.1 o superiore."
            notfound_nomsg:
              SetErrorLevel 4

            done:
          SectionEnd
          '@
          $script=$script.Replace('__SIZE__',$env:APP_ASAR_SIZE)
          Set-Content -Path 'update.nsi' -Value $script -Encoding UTF8
          & "$env:ProgramFiles (x86)\NSIS\makensis.exe" /V2 update.nsi
          if($LASTEXITCODE -ne 0){ throw "makensis fallito: $LASTEXITCODE" }
          $u=Get-Item 'DocFix_Aggiornamento_1.3.exe'
          Write-Host "Updater: $($u.Length) bytes"

      - name: Download previous DocFix 1.1 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force old | Out-Null
          gh run download 41830463407 -n DocFix-Setup-Windows-1.2 -D old
          if(!(Test-Path 'old\DocFix_Setup_1.2.0.exe')){ throw 'Installer 1.1 non trovato' }

      - name: Install DocFix 1.2 and keep it running
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'old\DocFix_Setup_1.1.0.exe') -ArgumentList '/S' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Installazione 1.1 fallita: $($p.ExitCode)" }
          $exe=Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'DocFix.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(!$exe){ throw 'DocFix 1.2 installato non trovato' }
          "DOCFIX_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOCFIX_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $app=Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 7
          if($app.HasExited){ throw 'DocFix 1.2 non si è aperto prima del test aggiornamento' }
          Write-Host "DocFix 1.2 avviato: PID $($app.Id)"

      - name: Apply incremental update while DocFix is running
        shell: pwsh
        working-directory: docfix-build
        run: |
          $u=(Resolve-Path 'DocFix_Aggiornamento_1.3.exe').Path
          $p=Start-Process -FilePath $u -ArgumentList '/S' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Updater fallito: exit $($p.ExitCode)" }
          Start-Sleep -Seconds 4
          $installed=Join-Path $env:DOCFIX_DIR 'resources\app.asar'
          $hash=(Get-FileHash $installed -Algorithm SHA256).Hash
          if($hash -ne $env:APP_ASAR_SHA){ throw "Hash app.asar installato errato: $hash" }
          Write-Host 'Payload 1.3 applicato correttamente'

      - name: Validate updated DocFix 1.3
        shell: pwsh
        run: |
          Get-Process DocFix -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $p=Start-Process -FilePath $env:DOCFIX_EXE -ArgumentList '--self-test' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Self-test DocFix aggiornato fallito: $($p.ExitCode)" }
          $normal=Start-Process -FilePath $env:DOCFIX_EXE -PassThru
          Start-Sleep -Seconds 7
          if($normal.HasExited){ throw 'DocFix aggiornato non si apre normalmente' }
          Stop-Process -Id $normal.Id -Force
          Write-Host 'Aggiornamento 1.1 -> 1.3 e apertura finale superati'

      - name: Compare updater size with full installer
        shell: pwsh
        working-directory: docfix-build
        run: |
          $u=Get-Item 'DocFix_Aggiornamento_1.3.exe'
          $full=137471977
          if($u.Length -ge $full){ throw "Updater non è più piccolo dell'installer completo: $($u.Length)" }
          $hash=(Get-FileHash $u.FullName -Algorithm SHA256).Hash
          Write-Host "UPDATER_SIZE=$($u.Length)"
          Write-Host "FULL_INSTALLER_SIZE=$full"
          Write-Host "UPDATER_SHA256=$hash"


      - name: Publish verified update channel
        shell: pwsh
        working-directory: docfix-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='DocFix_Aggiornamento_1.3.exe'
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Set-Content -Path 'DocFix_Aggiornamento_1.3.sha256' -Encoding ascii
          $tag='v1.3.0'
          $notes='Aggiunge il pulsante Aggiorna DocFix direttamente nell’app. Mantiene il ritaglio multi-tessera della 1.2 e il funzionamento offline.'
          gh release view $tag *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag $exe 'DocFix_Aggiornamento_1.3.sha256' --clobber
            gh release edit $tag --title 'DocFix Desktop 1.3' --notes $notes --latest
          } else {
            gh release create $tag $exe 'DocFix_Aggiornamento_1.3.sha256' --title 'DocFix Desktop 1.3' --notes $notes --latest
          }

      - name: Verify public update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r=gh api repos/Jorrob98/PDF-Facile/releases/latest | ConvertFrom-Json
          if($r.tag_name -ne 'v1.3.0'){ throw "Release latest errata: $($r.tag_name)" }
          $names=@($r.assets.name)
          if($names -notcontains 'DocFix_Aggiornamento_1.3.exe'){ throw 'EXE update non pubblicato' }
          if($names -notcontains 'DocFix_Aggiornamento_1.3.sha256'){ throw 'SHA update non pubblicato' }
          Write-Host 'Canale aggiornamenti 1.3 verificato'

      - name: Upload incremental updater
        uses: actions/upload-artifact@v4
        with:
          name: DocFix-Aggiornamento-1.3
          path: docfix-build/DocFix_Aggiornamento_1.3.exe
          if-no-files-found: error
          retention-days: 7
