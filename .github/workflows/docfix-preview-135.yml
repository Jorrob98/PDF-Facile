name: Build DocFix 1.9.35 Preview (opt-in only)
on:
  push:
    branches: [docfix-qa-2026-11-12]

concurrency:
  group: docfix-experimental-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DocFix source
        uses: actions/checkout@v4
        with:
          ref: docfix-qa-2026-11-12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund

      - name: Bundle local PDF and OCR engines
        working-directory: docfix-build
        run: npm run prepare-vendor

      - name: Restore icon
        shell: bash
        working-directory: docfix-build
        run: |
          mkdir -p build
          base64 -d build/icon.b64 > build/icon.png

      - name: Verify exploratory tests before building
        shell: bash
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node --check preload.js
          node --check app/card-texture-crop.js
          node --check app/card-onepass.js
          node --check app/card-pair-proof.js
          node --check app/document-page-guard.js
          node qa-stability-guard.cjs
          npm run test:docfix:qa
          # IMPORTANT: 44/50 detector stress scenarios (88%) is not a stable
          # release pass. This beta is a manual opt-in, not a 'latest' release.

      - name: Stamp 1.9.35 preview and package verified source
        shell: bash
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.version!=='1.9.34')throw Error('Unexpected source version');
          pkg.version='1.9.35';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const files=['main.js','preload.js'];
          const visit=(dir)=>{
            for(const name of fs.readdirSync(dir)){
              if(name==='vendor')continue;
              const p=path.join(dir,name),st=fs.statSync(p);
              if(st.isDirectory())visit(p);
              else if(/\.(js|html|json)$/.test(name))files.push(p);
            }
          };
          visit('app');
          for(const file of files){
            const original=fs.readFileSync(file,'utf8');
            if(original.includes('1.9.34'))
              fs.writeFileSync(file,original.replaceAll('1.9.34','1.9.35'));
          }
          const entry=fs.readFileSync('main.js','utf8');
          if(!entry.includes("out.updaterVersion")||!entry.includes("1.9.35"))
            throw Error('Preview stamp incomplete');
          NODE
          node --check main.js
          node --check app/card-texture-crop.js
          node --check app/card-pair-proof.js
          node --check app/document-page-guard.js
          rm -rf pack verify
          mkdir -p pack/app pack/build
          cp main.js preload.js ocr-cloud-main.js package.json pack/
          cp -a app/. pack/app/
          cp build/icon.png pack/build/icon.png
          npx --no-install asar pack pack DocFix-1.9.35-app.asar
          npx --no-install asar extract DocFix-1.9.35-app.asar verify
          node --check verify/main.js
          grep -F '1.9.35' verify/package.json
          grep -F 'manualPending===true' verify/app/index.html
          grep -F 'decideTwoUpProof' verify/app/index.html
          grep -F 'physicallyVerified:best.physicallyVerified===true' verify/app/card-onepass.js
          test -f verify/app/vendor/pdfjs/pdf.min.mjs
          test -f verify/app/vendor/tessdata/ita.traineddata.gz
          size=$(stat -c%s DocFix-1.9.35-app.asar)
          if [ "$size" -lt 1000000 ]; then echo "ASAR size invalid: $size"; exit 1; fi
          echo "APP_ASAR_SIZE=$size" >> "$GITHUB_ENV"
          echo "APP_ASAR_SHA=$(sha256sum DocFix-1.9.35-app.asar | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Run Electron functional self-test before publishing
        shell: bash
        working-directory: docfix-build
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          timeout 180s xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --self-test

      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis

      - name: Build Windows incremental updater
        shell: bash
        working-directory: docfix-build
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$version" | cut -d. -f1,2)
          updater="DocFix_Prova_${version}.exe"
          shafile="DocFix_Prova_${version}.sha256"
          cat > update.nsi <<'NSI'
          Unicode true
          Name "Aggiornamento DocFix 1.9.35"
          OutFile "__UPDATER_EXE__"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          SetCompressorDictSize 64
          InstallDir "$LOCALAPPDATA\Programs\docfix-desktop"
          ShowInstDetails nevershow
          AutoCloseWindow true
          Page instfiles

          Section "Aggiornamento"
            IfFileExists "$INSTDIR\DocFix.exe" found tryalternate

            tryalternate:
              StrCpy $INSTDIR "$LOCALAPPDATA\Programs\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found scanprograms

            scanprograms:
              StrCpy $1 "$LOCALAPPDATA\Programs"
              FindFirst $2 $3 "$1\*"
            scanloop:
              StrCmp $3 "" scanlocal
              StrCmp $3 "." scannext
              StrCmp $3 ".." scannext
              IfFileExists "$1\$3\DocFix.exe" 0 scannext
              StrCpy $INSTDIR "$1\$3"
              FindClose $2
              Goto found
            scannext:
              FindNext $2 $3
              Goto scanloop

            scanlocal:
              FindClose $2
              StrCpy $INSTDIR "$LOCALAPPDATA\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found notfound

            found:
              DetailPrint "Chiudo DocFix..."
              nsExec::ExecToStack 'taskkill /IM "DocFix.exe" /F'
              Pop $0
              Pop $1
              Sleep 1400

              Delete "$INSTDIR\resources\app.asar.bak"
              StrCpy $4 0

            backup_retry:
              ClearErrors
              Rename "$INSTDIR\resources\app.asar" "$INSTDIR\resources\app.asar.bak"
              IfErrors backup_wait backup_ok

            backup_wait:
              IntOp $4 $4 + 1
              IntCmp $4 12 backupfail backup_sleep backupfail

            backup_sleep:
              Sleep 500
              Goto backup_retry

            backup_ok:
              SetOutPath "$INSTDIR\resources"
              File /oname=app.asar.new "DocFix-1.9.35-app.asar"

              ClearErrors
              FileOpen $3 "$INSTDIR\resources\app.asar.new" r
              IfErrors rollback
              FileSeek $3 0 END $0
              FileClose $3
              IntCmp $0 __SIZE__ payloadok rollback rollback

            payloadok:
              StrCpy $4 0

            install_retry:
              ClearErrors
              Rename "$INSTDIR\resources\app.asar.new" "$INSTDIR\resources\app.asar"
              IfErrors install_wait install_ok

            install_wait:
              IntOp $4 $4 + 1
              IntCmp $4 12 rollback install_sleep rollback

            install_sleep:
              Sleep 500
              Goto install_retry

            install_ok:
              FileOpen $2 "$INSTDIR\resources\docfix-version.txt" w
              FileWrite $2 "1.9.35"
              FileClose $2
              FileOpen $2 "$INSTDIR\resources\docfix-update-status.txt" w
              FileWrite $2 "OK 1.9.35"
              FileClose $2
              DetailPrint "Backup versione precedente conservato per ripristino"


              Sleep 700
              ExecShell "open" "$INSTDIR\DocFix.exe"
              IfSilent success_silent 0
              MessageBox MB_ICONINFORMATION|MB_OK "DocFix è stato aggiornato alla versione 1.9.35.$\r$\n$\r$\nIl programma è stato riaperto."
            success_silent:
              SetErrorLevel 0
              Goto done

            rollback:
              Delete "$INSTDIR\resources\app.asar.new"
              Delete "$INSTDIR\resources\app.asar"
              ClearErrors
              Rename "$INSTDIR\resources\app.asar.bak" "$INSTDIR\resources\app.asar"
              IfSilent rollback_silent 0
              ExecShell "open" "$INSTDIR\DocFix.exe"
              MessageBox MB_ICONSTOP|MB_OK "Aggiornamento non applicato. DocFix è stato ripristinato."
            rollback_silent:
              SetErrorLevel 2
              Goto done

            backupfail:
              IfSilent backup_silent 0
              ExecShell "open" "$INSTDIR\DocFix.exe"
              MessageBox MB_ICONSTOP|MB_OK "Non riesco ad aggiornare DocFix. La versione precedente non è stata modificata."
            backup_silent:
              SetErrorLevel 3
              Goto done

            notfound:
              IfSilent notfound_silent 0
              MessageBox MB_ICONSTOP|MB_OK "DocFix non risulta installato in questo PC."
            notfound_silent:
              SetErrorLevel 4

            done:
          SectionEnd
          NSI
          sed -i "s/__SIZE__/$APP_ASAR_SIZE/g; s/__UPDATER_EXE__/$updater/g" update.nsi
          makensis -V2 update.nsi

          test -f "$updater"
          size=$(stat -c%s "$updater")
          if [ "$size" -lt 5000000 ]; then echo "Updater troppo piccolo: $size"; exit 1; fi

          sha=$(sha256sum "$updater" | awk '{print $1}')
          echo "$sha  $updater" > "$shafile"
          echo "UPDATER_FILE=$updater" >> "$GITHUB_ENV"
          echo "UPDATER_SHA_FILE=$shafile" >> "$GITHUB_ENV"
          echo "UPDATER_SIZE=$size"
          echo "UPDATER_SHA=$sha"
          file "$updater" | grep -Ei 'PE32|MS Windows'

      - name: Build one-click recovery to previously installed stable build
        shell: bash
        working-directory: docfix-build
        run: |
          set -euo pipefail
          cat > rollback.nsi <<'NSI'
          Unicode true
          Name "Ripristina DocFix 1.9.34"
          OutFile "DocFix_Ripristina_1.9.34.exe"
          RequestExecutionLevel user
          ShowInstDetails nevershow
          AutoCloseWindow true
          InstallDir "$LOCALAPPDATA\Programs\docfix-desktop"
          Page instfiles

          Section "Ripristino"
            IfFileExists "$INSTDIR\DocFix.exe" found tryalternate
            tryalternate:
              StrCpy $INSTDIR "$LOCALAPPDATA\Programs\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found scanprograms
            scanprograms:
              StrCpy $1 "$LOCALAPPDATA\Programs"
              FindFirst $2 $3 "$1\*"
            scanloop:
              StrCmp $3 "" scanlocal
              StrCmp $3 "." scannext
              StrCmp $3 ".." scannext
              IfFileExists "$1\$3\DocFix.exe" 0 scannext
              StrCpy $INSTDIR "$1\$3"
              FindClose $2
              Goto found
            scannext:
              FindNext $2 $3
              Goto scanloop
            scanlocal:
              FindClose $2
              StrCpy $INSTDIR "$LOCALAPPDATA\DocFix"
              IfFileExists "$INSTDIR\DocFix.exe" found notfound

            found:
              IfFileExists "$INSTDIR\resources\app.asar.bak" restore nobackup
            restore:
              nsExec::ExecToStack 'taskkill /IM "DocFix.exe" /F'
              Pop $0
              Pop $1
              Sleep 1400
              Delete "$INSTDIR\resources\app.asar.prova"
              ClearErrors
              Rename "$INSTDIR\resources\app.asar" "$INSTDIR\resources\app.asar.prova"
              IfErrors restorefail
              ClearErrors
              Rename "$INSTDIR\resources\app.asar.bak" "$INSTDIR\resources\app.asar"
              IfErrors rollbackrestore
              Delete "$INSTDIR\resources\app.asar.prova"
              FileOpen $2 "$INSTDIR\resources\docfix-version.txt" w
              FileWrite $2 "1.9.34"
              FileClose $2
              FileOpen $2 "$INSTDIR\resources\docfix-update-status.txt" w
              FileWrite $2 "RIPRISTINATO 1.9.34"
              FileClose $2
              ExecShell "open" "$INSTDIR\DocFix.exe"
              MessageBox MB_ICONINFORMATION|MB_OK "Ripristino completato: DocFix 1.9.34."
              SetErrorLevel 0
              Goto done
            rollbackrestore:
              Rename "$INSTDIR\resources\app.asar.prova" "$INSTDIR\resources\app.asar"
            restorefail:
              MessageBox MB_ICONSTOP|MB_OK "Ripristino non riuscito. I file esistenti sono stati conservati."
              SetErrorLevel 3
              Goto done
            nobackup:
              MessageBox MB_ICONEXCLAMATION|MB_OK "Nessun backup trovato. DocFix non e stato modificato."
              SetErrorLevel 2
              Goto done
            notfound:
              MessageBox MB_ICONSTOP|MB_OK "DocFix non risulta installato su questo PC."
              SetErrorLevel 4
            done:
          SectionEnd
          NSI
          makensis -V2 rollback.nsi
          test -f DocFix_Ripristina_1.9.34.exe
          file DocFix_Ripristina_1.9.34.exe | grep -Ei 'PE32|MS Windows'
          sha256sum DocFix_Ripristina_1.9.34.exe > DocFix_Ripristina_1.9.34.sha256

      - name: Publish opt-in PRE-RELEASE only (never latest)
        shell: bash
        working-directory: docfix-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          updater="DocFix_Prova_${version}.exe"
          shafile="DocFix_Prova_${version}.sha256"
          tag="v${version}-prova"
          title="DocFix ${version} - VERSIONE DI PROVA"
          notes='VERSIONE SPERIMENTALE, SOLO PER COLLAUDO MANUALE. Correzione foto con due tessere piccole: secondo esame dei bordi sulla foto originale; nei casi incerti due anteprime distinte che richiedono conferma manuale prima del PDF. Riconoscimento sintetico 44/50 (88%) e non verificato su documenti reali. Non pubblicata come latest: aggiornamento stabile 1.9.34 invariato. Per tornare indietro usa il ripristino o il precedente installer. Nessuna garanzia di ritaglio automatico in tutte le foto.'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$updater" "$shafile" DocFix_Ripristina_1.9.34.exe DocFix_Ripristina_1.9.34.sha256 --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" "$updater" "$shafile" DocFix_Ripristina_1.9.34.exe DocFix_Ripristina_1.9.34.sha256 --target docfix-qa-2026-11-12 --title "$title" --notes "$notes" --prerelease
          fi

          gh release view "$tag" --json isPrerelease --jq .isPrerelease | grep -Fx true
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$updater"
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$shafile"
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx DocFix_Ripristina_1.9.34.exe

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFix-Preview-1.9.35
          path: |
            docfix-build/${{ env.UPDATER_FILE }}
            docfix-build/${{ env.UPDATER_SHA_FILE }}
            docfix-build/DocFix_Ripristina_1.9.34.exe
            docfix-build/DocFix_Ripristina_1.9.34.sha256
          if-no-files-found: error
          retention-days: 7
