name: DocFix 1.9.61 - PWA visual QA
on:
  push:
    branches: [docfix-161-pwa-visual-20261123]
    paths:
      - 'docfix-build/app/index.html'
      - 'docfix-build/app/docfix-ui-refresh.js'
      - 'docfix-build/app/docfix-pwa-refresh.css'
      - 'docfix-build/app/docfix-mark.svg'
      - 'docfix-build/main.js'
      - 'docfix-build/qa-pwa-ui-161.cjs'
      - '.github/workflows/docfix-ui-161-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PWA styling, syntax and classic edit/export
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node --check app/docfix-ui-refresh.js
          node qa-pwa-ui-161.cjs
          node qa-electron-inline-syntax.cjs
          node qa-precision-corner-editor-150.cjs
          node qa-simple-ui-and-four-card-order-159.cjs
          node qa-export-safety.cjs
          node qa-single-final-gate.cjs
          node qa-neural-borders-v2.cjs
          echo 'DOCFIX_UI_161_PASS'
