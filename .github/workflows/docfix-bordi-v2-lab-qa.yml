name: DOCFIX Bordi v2 - offline neural + geometric lab QA
on:
  push:
    branches: [docfix-bordi-v2-lab-20261123]
    paths:
      - 'docfix-build/app/docfix-neural-edges.js'
      - 'docfix-build/app/index.html'
      - 'docfix-build/qa-border-score-v2.cjs'
      - 'docfix-build/qa-border-score-v2.test.cjs'
      - 'docfix-build/qa-neural-borders-v2.cjs'
      - 'docfix-build/qa-single-final-gate.cjs'
      - 'docfix-build/prepare-vendor.js'
      - 'docfix-build/package.json'
      - 'docfix-build/main.js'
      - '.github/workflows/docfix-bordi-v2-lab-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  borders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax and pure geometry regression
        run: |
          node --check docfix-build/app/docfix-neural-edges.js
          node --check docfix-build/prepare-vendor.js
          node --check docfix-build/main.js
          node docfix-build/qa-border-score-v2.test.cjs
          node docfix-build/qa-neural-borders-v2.cjs
          node docfix-build/qa-electron-inline-syntax.cjs
          node docfix-build/qa-precision-corner-editor-150.cjs
          node docfix-build/qa-auto-quad-consensus-151.cjs
          node docfix-build/qa-simple-ui-and-four-card-order-159.cjs
          node docfix-build/qa-export-safety.cjs
      - name: Install pinned local AI and OCR dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund
      - name: Package fully offline model and wasm
        working-directory: docfix-build
        run: |
          npm run prepare-vendor
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const base='app/vendor/docfix-ml';
          for(const name of ['ort.min.js','lcnet100_h_e_bifpn_256_fp32.onnx','DocAligner-LICENSE.txt']){
            const file=path.join(base,name);
            if(!fs.existsSync(file)||fs.statSync(file).size<1000)throw Error('Offline ML asset missing: '+file);
          }
          const modelSize=fs.statSync(path.join(base,'lcnet100_h_e_bifpn_256_fp32.onnx')).size;
          if(modelSize<4000000||modelSize>6000000)throw Error('Model incomplete: '+modelSize);
          const wasm=fs.readdirSync(base).filter(x=>x.endsWith('.wasm'));
          if(!wasm.length)throw Error('ONNX local WASM runtime missing');
          console.log('PASS: '+wasm.length+' local runtimes + '+modelSize+' byte model');
          NODE
          npm run test:docfix:qa
      - name: Validate ONNX model in real Electron offline
        working-directory: docfix-build
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          timeout 240s xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --self-test 2>&1 | tee electron-bordi-v2.log
          grep -F 'SELF_TEST_RESULT' electron-bordi-v2.log
          if grep -Fq 'SELF_TEST_FAIL' electron-bordi-v2.log; then exit 1; fi
          grep -F '"neuralOfflineInference":true' electron-bordi-v2.log
