name: DOCFIX Bordi v2 - geometric lab QA
on:
  push:
    branches: [docfix-bordi-v2-lab-20261123]
    paths:
      - 'docfix-build/qa-border-score-v2.cjs'
      - 'docfix-build/qa-border-score-v2.test.cjs'
      - '.github/workflows/docfix-bordi-v2-lab-qa.yml'
  workflow_dispatch:
jobs:
  borders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify geometric scorer
        run: node docfix-build/qa-border-score-v2.test.cjs
