name: Temporary DocFix Windows Build
# SUPER RUN FINAL 1.9.32

on:
  push:
    branches: [main]

concurrency:
  group: docfix-full-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docfix:
    runs-on: windows-latest
    steps:
      - name: Checkout DocFix build branch
        uses: actions/checkout@v4
        with:
          ref: docfix-desktop-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore application icon
        shell: pwsh
        working-directory: docfix-build
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $b64=(Get-Content build\icon.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes('build\icon.png',[Convert]::FromBase64String($b64))

      - name: Install dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund

      - name: Bundle PDF and OCR libraries locally
        working-directory: docfix-build
        run: npm run prepare-vendor

      - name: Static anti-regression checks
        shell: pwsh
        working-directory: docfix-build
        run: |
          node --check main.js
          node --check qa-stability-guard.cjs
          node qa-stability-guard.cjs
          node --check preload.js
          node --check prepare-vendor.js
          node --check ocr-cloud-main.js
          node --check app\ocr-max.js
          node --check app\group1-safe-crop.js
          node --check app\card-physical-edges.js
          node --check app\card-onepass.js
          node --check app\card-quad-audit.js
          node --check app\card-sideways-pair.js
          node --check app\card-pair-proof.js
          node --check qa-pair-proof.cjs
          node qa-pair-proof.cjs
          node --check qa-manual-extra-card.cjs
          node qa-manual-extra-card.cjs
          node --check qa-sideways-pair.cjs
          node qa-sideways-pair.cjs
          node --check qa-quad-audit.cjs
          node qa-quad-audit.cjs
          node --check app\card-texture-crop.js
          node --check app\card-threeup.js
          node --check app\card-threeup-polish.js
          node --check app\card-licence-guard.js
          node --check app\card-licence-finish.js
          node --check qa-licence-finish.cjs
          node qa-licence-finish.cjs
          if(-not (Select-String -Path 'app\card-licence-guard.js' -Pattern 'function pinkEnvelope' -SimpleMatch -Quiet)){ throw 'Nuovo contorno rosa patente mancante' }
          if(-not (Select-String -Path 'qa-stability-guard.cjs' -Pattern 'portrait coordinate transformation' -SimpleMatch -Quiet)){ throw 'Test orientamento patente WhatsApp mancante' }
          node --check app\group2-orientation.js
          node --check app\group3-quality.js
          node --check app\group5-export.js
          if(-not (Select-String -Path 'app\group5-export.js' -Pattern 'jpegInfo' -Quiet)){ throw 'Verifica JPEG strutturale mancante' }
          if(-not (Select-String -Path 'app\ocr-max.js' -Pattern 'while(queue.length&&host' -SimpleMatch -Quiet)){ throw 'Correzione coda OCR mancante' }
          node --check app\stability.js
          $html=Get-Content app\index.html -Raw
          if($html.Length -lt 100000){ throw "index.html troppo piccolo/troncato: $($html.Length)" }
          if(-not $html.TrimEnd().EndsWith('</html>')){ throw 'index.html non termina correttamente' }
          if($html -match 'cdnjs|cdn.jsdelivr|unpkg.com'){ throw 'CDN trovato' }
          if($html -match 'serviceWorker|manifest.webmanifest|beforeinstallprompt|group6-pwa.js'){ throw 'Residuo PWA trovato' }
          if($html -notmatch 'stability.js'){ throw 'Stability layer mancante' }
          if($html -notmatch 'Ctrl\+O'){ throw 'Shortcut Ctrl+O mancante' }
          if($html -notmatch "document.addEventListener\('paste'"){ throw 'Incolla da Appunti mancante' }
          if($html -notmatch 'function qualityAudit'){ throw 'Controllo qualità 1.6 mancante' }
          if($html -notmatch 'Qualità da controllare'){ throw 'UI qualità 1.6 mancante' }
          $stability=Get-Content app\stability.js -Raw
          if($stability -notmatch 'docfix-update-progress'){ throw 'Barra progresso aggiornamento mancante' }
          if($stability -notmatch 'fmtEta'){ throw 'Stima tempo aggiornamento mancante' }
          if($stability -notmatch 'openUpdateProgress'){ throw 'Flusso aggiornamento diretto mancante' }
          $preload=Get-Content preload.js -Raw
          if($preload -notmatch 'onProgress'){ throw 'Bridge progresso updater mancante' }
          if($preload -notmatch 'DocFixOCRCloud'){ throw 'Bridge OCR MAX mancante' }
          $main=Get-Content main.js -Raw
          if($main -notmatch 'STARTUP_BUNDLE_OK'){ throw 'Fast-start bundle split mancante' }
          if($main -notmatch 'listen\(18654\)'){ throw 'Porta stabile DocFix mancante' }
          if($main -notmatch "startup-fallback'\),300"){ throw 'Fallback avvio rapido mancante' }
          $ocr=Get-Content app\ocr-max.js -Raw
          if($ocr -notmatch 'OCR MAX'){ throw 'OCR MAX mancante' }
          if($ocr -notmatch "createWorker\(\['ita','eng'\]"){ throw 'OCR italiano+inglese mancante' }
          $cloud=Get-Content ocr-cloud-main.js -Raw
          if($cloud -notmatch 'eu-vision.googleapis.com'){ throw 'Google Vision EU mancante' }
          if($cloud -notmatch 'prebuilt-idDocument'){ throw 'Azure ID Document mancante' }
          if($cloud -notmatch 'jsonRequestRetry'){ throw 'Retry cloud OCR mancante' }
          if($cloud -notmatch 'google-rescue'){ throw 'Google rescue OCR mancante' }
          if($ocr -notmatch 'docfix:reset'){ throw 'Reset coda OCR mancante' }
          if($ocr -notmatch 'scheduleWorkerRelease'){ throw 'Rilascio RAM OCR mancante' }
          if($ocr -notmatch 'labeledFields'){ throw 'Estrazione campi etichettati mancante' }
          $stability=Get-Content app\stability.js -Raw
          if($stability -notmatch 'refreshUpdateButton'){ throw 'Controllo automatico aggiornamenti mancante' }
          if($stability -notmatch 'update.hidden=true'){ throw 'Pulsante aggiornamento non nascosto di default' }
          if($stability -notmatch 'Aggiornamento disponibile'){ throw 'Etichetta aggiornamento disponibile mancante' }
          $index=Get-Content app\index.html -Raw
          if($index -notmatch 'safeMultiCropPreview'){ throw 'Ritaglio sicuro multi-tessera mancante' }
          if($index -notmatch 'multiCropHealthy'){ throw 'Validazione multi-tessera mancante' }
          if($index -notmatch 'orderedIncoming'){ throw 'Ordinamento naturale file multipli mancante' }
          $main=Get-Content main.js -Raw
          if($main -notmatch 'inputOrder'){ throw 'Self-test ordine file mancante' }
          if($main -notmatch 'reverseFileOrder'){ throw 'Self-test inversione file mancante' }
          if($index -notmatch 'stackedCardCandidatesByGap'){ throw 'Rilevatore due tessere sovrapposte mancante' }
          if($main -notmatch 'stackedEdgeCards'){ throw 'Self-test tessere ai bordi mancante' }
          if($main -notmatch 'fourCardPairOrder'){ throw 'Self-test 2 file -> 4 anteprime mancante' }
          if($main -notmatch 'multiRefineSafe'){ throw 'Self-test rifinitura multi-tessera mancante' }
          if($main -notmatch 'stackedRecovery'){ throw 'Self-test recupero 3/4 mancante' }
          if($main -notmatch 'twoByTwoGate'){ throw 'Self-test blocco set incompleto mancante' }
          if($main -notmatch 'onePlusOneRecovery'){ throw 'Self-test recupero 1+1 mancante' }
          if($main -notmatch 'tightSeparatedCard'){ throw 'Self-test rifinitura bordo tessera mancante' }
          if($index -notmatch 'card-texture-crop.js'){ throw 'Nuovo ritaglio originale non caricato' }
          if($index -notmatch 'card-licence-guard.js'){ throw 'Motore bordi fisici patente mancante' }
          if($main -notmatch 'licencePhysicalBorderRecovered'){ throw 'Test recupero bordo patente mancante' }
          if($main -notmatch 'licenceOtherCardsUntouched'){ throw 'Test protezione CF/CI mancante' }
          if($index -notmatch 'card-threeup-polish.js'){ throw 'Motore geometria perfezionata mancante' }
          if($index -notmatch 'regroupSixCards'){ throw 'Ordinamento sei documenti mancante' }
          if($main -notmatch 'threeCardPolish'){ throw 'Self-test bordi patente mancante' }
          if($index -notmatch 'planSixCardOrder'){ throw 'Ordinamento 6 tessere non caricato' }
          if($index -notmatch 'cfDarkness'){ throw 'Prova riconoscimento verso tessera sanitaria mancante' }
          if($main -notmatch 'sixCardActualOrder'){ throw 'Test nuovo ordine 6/6 mancante' }
          if($index -notmatch 'DocFixLicenceFinish'){ throw 'Correzione fisica patente mancante' }
          if($index -notmatch "cardKind==='licence'"){ throw 'Correzione patente disattivata' }
          if($main -notmatch 'sixPageUniqueExport'){ throw 'Test nuovo nome PDF mancante' }
          if($main -notmatch 'sixCardDarknessRecovery'){ throw 'Test foto scure mancante' }
          if($main -notmatch 'sixCardUncertainSafe'){ throw 'Test verso incerto mancante' }
          if($main -notmatch 'sixCardGrouping'){ throw 'Self-test ordine fronte-retro mancante' }
          if($index -notmatch 'card-threeup.js'){ throw 'Motore 3 tessere non caricato' }
          if($index -notmatch 'threeByTwoState'){ throw 'Verifica 6 pagine assente' }
          if($main -notmatch 'threeCardsFromOne'){ throw 'Test 3 tessere mancante' }
          if($main -notmatch 'threeCardsOrientCorrect'){ throw 'Test rotazione mancante' }
          if($main -notmatch 'textureTwoCards'){ throw 'Self-test nuovi ritagli mancante' }
          if($main -notmatch 'cfPhysicalCrop'){ throw 'Self-test bordo codice fiscale mancante' }
          if($main -notmatch 'fineDeskew'){ throw 'Self-test raddrizzamento fine mancante' }
          if($main -notmatch 'cfFineDeskew'){ throw 'Self-test raddrizzamento CF mancante' }
          if($main -notmatch 'deskewResidualVerified'){ throw 'Self-test residuo deskew mancante' }
          if($index -notmatch 'residuo '){ throw 'Indicatore residuo deskew mancante' }
          if($index -notmatch 'nessun miglioramento verificato'){ throw 'Fallback deskew verificato mancante' }
          if($main -notmatch 'diagnosticsCoverage'){ throw 'Copertura diagnostica deskew mancante' }
          if($index -notmatch 'projection-bands'){ throw 'Deskew doppia banda mancante' }
          if($index -notmatch 'estimateFineDeskew'){ throw 'Raddrizzamento fine mancante' }
          if($index -notmatch 'raddrizzato '){ throw 'Stato raddrizzamento fine mancante' }
          if($index -notmatch "cardKind==='cf'"){ throw 'Modalità dedicata codice fiscale mancante' }
          if($index -notmatch 'rotatedProbe'){ throw 'Sonda ruotata codice fiscale mancante' }
          if($index -notmatch 'tightenSeparatedCardCanvas'){ throw 'Secondo ritaglio fisico tessera mancante' }
          if($index -notmatch 'cropVerified:physicalVerified'){ throw 'Stato bordo fisico rifinito mancante' }
          if($index -notmatch 'twoByTwoCandidateMeta'){ throw 'Decisione recupero 1+1 mancante' }
          if($index -notmatch 'rebuildSourceAsTwoUp'){ throw 'Ricostruzione sorgente 2x2 mancante' }
          if($index -notmatch 'stackedCardCandidatesRecovery'){ throw 'Rilevatore di recupero 2x2 mancante' }
          if($index -notmatch 'recoverIncompleteTwoByTwo'){ throw 'Recupero automatico 3/4 mancante' }
          if($index -notmatch 'Set incompleto'){ throw 'Avviso set incompleto mancante' }
          if($index -notmatch 'safeRefineMultiQuad'){ throw 'Rifinitura prudente multi-tessera mancante' }
          if($index -notmatch 'regroupLatestTwoUpSources'){ throw 'Accoppiamento caricamenti separati mancante' }
          if($index -notmatch 'Ritaglio prudente: controlla i bordi'){ throw 'Fallback due anteprime prudente mancante' }
          if($index -notmatch 'set completo 4/4'){ throw 'Indicatore set 4/4 mancante' }
          if($index -notmatch 'Scambia fronte/retro'){ throw 'Scambio fronte/retro mancante' }
          if($index -notmatch 'pairedFourCards'){ throw 'Raggruppamento 2x2 mancante' }
          if($index -notmatch '4 tessere separate'){ throw 'Stato 4 tessere mancante' }
          if($index -notmatch 'Inverti ordine file'){ throw 'Comando inversione file mancante' }
          $crop=Get-Content app\group1-safe-crop.js -Raw
          if($crop -notmatch 'group1-superrun-20261105'){ throw 'Fix limiti ritaglio SUPER RUN mancante' }
          if($main -notmatch 'no-cache, no-store, must-revalidate'){ throw 'Protezione cache obsoleta mancante' }
          if($main -notmatch "child.once\('spawn'"){ throw 'Conferma avvio updater mancante' }
          $required=@(
            'app\vendor\pdfjs\pdf.min.mjs',
            'app\vendor\pdfjs\pdf.worker.min.mjs',
            'app\vendor\pdf-lib\pdf-lib.min.js',
            'app\vendor\tesseract\tesseract.min.js',
            'app\vendor\tesseract\worker.min.js',
            'app\vendor\tessdata\eng.traineddata.gz',
            'app\vendor\tessdata\ita.traineddata.gz'
          )
          foreach($f in $required){ if(!(Test-Path $f)){ throw "Manca $f" } }
          $cores=(Get-ChildItem app\vendor\tesseract-core\tesseract-core*.wasm.js -ErrorAction SilentlyContinue)
          if($cores.Count -lt 4){ throw "Core Tesseract incompleti: $($cores.Count)" }
          Write-Host "Controlli statici superati"

      - name: Build installer
        working-directory: docfix-build
        run: npm run dist

      - name: Self-test unpacked application
        shell: pwsh
        working-directory: docfix-build
        run: |
          $exe=(Resolve-Path 'dist\win-unpacked\DocFix.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Self-test unpacked fallito: exit $($p.ExitCode)" }
          Write-Host 'Self-test unpacked superato'

      - name: Install DocFix silently
        shell: pwsh
        working-directory: docfix-build
        run: |
          $installer=(Resolve-Path 'dist\DocFix_Setup_1.9.32.exe').Path
          $p=Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Installazione fallita: exit $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          $exe=Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'DocFix.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(!$exe){ throw 'DocFix.exe installato non trovato' }
          "DOCFIX_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOCFIX_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installato in $($exe.Directory.FullName)"

      - name: Self-test installed application offline
        shell: pwsh
        run: |
          $p=Start-Process -FilePath $env:DOCFIX_EXE -ArgumentList '--self-test' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Self-test installato fallito: exit $($p.ExitCode)" }
          Write-Host 'Self-test installato superato'

      - name: First-click visibility and second startup
        shell: pwsh
        run: |
          Get-Process DocFix -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $p=Start-Process -FilePath $env:DOCFIX_EXE -PassThru
          Start-Sleep -Seconds 4
          if($p.HasExited){ throw "Primo avvio fallito: exit $($p.ExitCode)" }
          $log=Get-ChildItem "$env:APPDATA" -Recurse -Filter 'docfix.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(!$log){ throw 'Log DocFix non trovato dopo il primo clic' }
          $tail=(Get-Content $log.FullName -Tail 80) -join "\n"
          if($tail -notmatch 'WINDOW_SHOWN'){ throw 'La finestra non risulta mostrata al primo avvio' }
          $matches=[regex]::Matches($tail,'WINDOW_SHOWN\s+\S+\s+(\d+)ms')
          if($matches.Count -lt 1){ throw 'Tempo di apertura non registrato' }
          $ms=[int]$matches[$matches.Count-1].Groups[1].Value
          if($ms -gt 1200){ throw "Finestra mostrata troppo lentamente: $ms ms" }
          Write-Host "Primo clic: finestra mostrata in $ms ms"
          Get-Process DocFix -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $p2=Start-Process -FilePath $env:DOCFIX_EXE -PassThru
          Start-Sleep -Seconds 4
          if($p2.HasExited){ throw "Secondo avvio fallito: exit $($p2.ExitCode)" }
          Get-Process DocFix -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host 'Secondo avvio superato'

      - name: Check shortcuts and uninstall
        shell: pwsh
        run: |
          $desktop=(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'DocFix*.lnk' -ErrorAction SilentlyContinue)
          $start=Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'DocFix*.lnk' -ErrorAction SilentlyContinue
          if(!$desktop -and !$start){ throw 'Collegamento DocFix non trovato' }
          $uninstall=Get-ChildItem $env:DOCFIX_DIR -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(!$uninstall){ throw 'Disinstallatore non trovato' }
          $p=Start-Process -FilePath $uninstall.FullName -ArgumentList '/S' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Disinstallazione fallita: exit $($p.ExitCode)" }
          Start-Sleep -Seconds 4
          if(Test-Path $env:DOCFIX_EXE){ throw 'DocFix.exe presente dopo disinstallazione' }
          Write-Host 'Installazione, collegamenti e disinstallazione superati'

      - name: Verify final installer
        shell: pwsh
        working-directory: docfix-build
        run: |
          $f=Get-Item 'dist\DocFix_Setup_1.9.32.exe'
          if($f.Length -lt 100000000){ throw "Installer troppo piccolo: $($f.Length)" }
          $hash=(Get-FileHash $f.FullName -Algorithm SHA256).Hash
          Write-Host "SIZE=$($f.Length)"
          Write-Host "SHA256=$hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFix-Setup-Windows-1.9.32
          path: docfix-build/dist/DocFix_Setup_1.9.32.exe
          if-no-files-found: error
          retention-days: 7
