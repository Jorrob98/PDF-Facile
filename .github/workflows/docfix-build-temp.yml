name: Temporary DocFix Windows Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-docfix:
    runs-on: windows-latest
    steps:
      - name: Checkout DocFix build branch
        uses: actions/checkout@v4
        with:
          ref: docfix-desktop-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore application icon
        shell: pwsh
        working-directory: docfix-build
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $b64=(Get-Content build\icon.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes('build\icon.png',[Convert]::FromBase64String($b64))

      - name: Install dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund

      - name: Bundle PDF and OCR libraries locally
        working-directory: docfix-build
        run: npm run prepare-vendor

      - name: Static anti-regression checks
        shell: pwsh
        working-directory: docfix-build
        run: |
          node --check main.js
          node --check preload.js
          node --check prepare-vendor.js
          node --check app\group1-safe-crop.js
          node --check app\group2-orientation.js
          node --check app\group3-quality.js
          node --check app\group5-export.js
          node --check app\stability.js
          $html=Get-Content app\index.html -Raw
          if($html.Length -lt 100000){ throw "index.html troppo piccolo/troncato: $($html.Length)" }
          if(-not $html.TrimEnd().EndsWith('</html>')){ throw 'index.html non termina correttamente' }
          if($html -match 'cdnjs|cdn.jsdelivr|unpkg.com'){ throw 'CDN trovato' }
          if($html -match 'serviceWorker|manifest.webmanifest|beforeinstallprompt|group6-pwa.js'){ throw 'Residuo PWA trovato' }
          if($html -notmatch 'stability.js'){ throw 'Stability layer mancante' }
          $required=@(
            'app\vendor\pdfjs\pdf.min.mjs',
            'app\vendor\pdfjs\pdf.worker.min.mjs',
            'app\vendor\pdf-lib\pdf-lib.min.js',
            'app\vendor\tesseract\tesseract.min.js',
            'app\vendor\tesseract\worker.min.js',
            'app\vendor\tessdata\eng.traineddata.gz'
          )
          foreach($f in $required){ if(!(Test-Path $f)){ throw "Manca $f" } }
          $cores=(Get-ChildItem app\vendor\tesseract-core\tesseract-core*.wasm.js -ErrorAction SilentlyContinue)
          if($cores.Count -lt 4){ throw "Core Tesseract incompleti: $($cores.Count)" }
          Write-Host "Controlli statici superati"

      - name: Build installer
        working-directory: docfix-build
        run: npm run dist

      - name: Self-test unpacked application
        shell: pwsh
        working-directory: docfix-build
        run: |
          $exe=(Resolve-Path 'dist\win-unpacked\DocFix.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Self-test unpacked fallito: exit $($p.ExitCode)" }
          Write-Host 'Self-test unpacked superato'

      - name: Install DocFix silently
        shell: pwsh
        working-directory: docfix-build
        run: |
          $installer=(Resolve-Path 'dist\DocFix_Setup_1.3.0.exe').Path
          $p=Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Installazione fallita: exit $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          $exe=Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'DocFix.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(!$exe){ throw 'DocFix.exe installato non trovato' }
          "DOCFIX_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOCFIX_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installato in $($exe.Directory.FullName)"

      - name: Self-test installed application offline
        shell: pwsh
        run: |
          $p=Start-Process -FilePath $env:DOCFIX_EXE -ArgumentList '--self-test' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Self-test installato fallito: exit $($p.ExitCode)" }
          Write-Host 'Self-test installato superato'

      - name: First and second normal startup
        shell: pwsh
        run: |
          for($i=1;$i -le 2;$i++){
            $p=Start-Process -FilePath $env:DOCFIX_EXE -PassThru
            Start-Sleep -Seconds 8
            if($p.HasExited){ throw "Avvio normale $i fallito: exit $($p.ExitCode)" }
            Get-Process DocFix -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            Write-Host "Avvio normale $i superato"
          }

      - name: Check shortcuts and uninstall
        shell: pwsh
        run: |
          $desktop=(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'DocFix*.lnk' -ErrorAction SilentlyContinue)
          $start=Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'DocFix*.lnk' -ErrorAction SilentlyContinue
          if(!$desktop -and !$start){ throw 'Collegamento DocFix non trovato' }
          $uninstall=Get-ChildItem $env:DOCFIX_DIR -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(!$uninstall){ throw 'Disinstallatore non trovato' }
          $p=Start-Process -FilePath $uninstall.FullName -ArgumentList '/S' -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Disinstallazione fallita: exit $($p.ExitCode)" }
          Start-Sleep -Seconds 4
          if(Test-Path $env:DOCFIX_EXE){ throw 'DocFix.exe presente dopo disinstallazione' }
          Write-Host 'Installazione, collegamenti e disinstallazione superati'

      - name: Verify final installer
        shell: pwsh
        working-directory: docfix-build
        run: |
          $f=Get-Item 'dist\DocFix_Setup_1.3.0.exe'
          if($f.Length -lt 100000000){ throw "Installer troppo piccolo: $($f.Length)" }
          $hash=(Get-FileHash $f.FullName -Algorithm SHA256).Hash
          Write-Host "SIZE=$($f.Length)"
          Write-Host "SHA256=$hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFix-Setup-Windows-1.3
          path: docfix-build/dist/DocFix_Setup_1.3.0.exe
          if-no-files-found: error
          retention-days: 7
