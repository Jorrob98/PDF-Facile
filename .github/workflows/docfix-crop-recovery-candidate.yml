name: DocFix crop recovery candidate QA (no release)
on:
  push:
    branches:
      - docfix-crop-recovery-candidate-20261116
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund
      - name: Prepare offline engines
        working-directory: docfix-build
        run: npm run prepare-vendor
      - name: Syntax and new small-card test
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node --check app/card-over-paper.js
          node --check app/card-touching-pair.js
          node --check qa-small-card-a4.cjs
          node qa-small-card-a4.cjs
          node --check qa-facsimile-card-stack.cjs
          node qa-facsimile-card-stack.cjs
      - name: Full existing regression tests
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node qa-stability-guard.cjs
          npm run test:docfix:qa
      - name: Electron smoke test (no publication)
        working-directory: docfix-build
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          timeout 180s xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --self-test
