name: DocFix 1.9.47 light-desk ID-1 crop QA (no release)
on:
  push:
    branches:
      - docfix-147-light-desk-id1-20261117
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local dependencies
        working-directory: docfix-build
        run: npm install --no-audit --no-fund
      - name: Prepare offline engines
        working-directory: docfix-build
        run: npm run prepare-vendor
      - name: Syntax and new small-card test
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node --check main.js
          node qa-electron-inline-syntax.cjs
          node --check app/card-over-paper.js
          node --check app/card-touching-pair.js
          node --check qa-small-card-a4.cjs
          node qa-small-card-a4.cjs
          node --check app/docfix-visual-card.js
          node --check qa-visual-photo-preview.cjs
          node qa-visual-photo-preview.cjs
          node --check qa-cie-front-office.cjs
          node qa-cie-front-office.cjs
          node --check app/docfix-card-deskew.js
          node --check qa-cie-four-corner-deskew.cjs
          node qa-cie-four-corner-deskew.cjs
          node --check app/docfix-fine-deskew.js
          node --check qa-fine-deskew-146.cjs
          node qa-fine-deskew-146.cjs
          node --check app/docfix-texture-card.js
          node --check qa-light-desk-147.cjs
          node qa-light-desk-147.cjs
          node --check qa-facsimile-card-stack.cjs
          node qa-facsimile-card-stack.cjs
      - name: Full existing regression tests
        working-directory: docfix-build
        run: |
          set -euo pipefail
          node qa-stability-guard.cjs
          npm run test:docfix:qa
      - name: Electron smoke test (no publication)
        working-directory: docfix-build
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          # Exit status alone is insufficient: Electron can quit 0 after a logged
          # SELF_TEST_FAIL in some Linux runners. Require an actual pass report.
          timeout 180s xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --self-test 2>&1 | tee electron-selftest.log
          if grep -Fq 'SELF_TEST_FAIL' electron-selftest.log; then echo 'Electron self-test explicitly failed'; exit 1; fi
          grep -F 'SELF_TEST_RESULT' electron-selftest.log
